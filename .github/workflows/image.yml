name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deacon-host-depletion

jobs:
  validate-cwl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install cwltool
      - run: cwltool --validate cavatica/deacon-host-depletion.cwl

  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (load locally for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cavatica/Dockerfile
          load: true
          tags: deacon-host-depletion:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Synthetic end-to-end test inside the image
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" deacon-host-depletion:test \
            bash -c 'deacon --version && samtools --version | head -1 && /tests/run_synthetic_test.sh'

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cavatica/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
